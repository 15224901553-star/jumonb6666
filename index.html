<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高防服务器DDoS攻击模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #2a3c7c);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #a0c8ff;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .panel {
            background: rgba(30, 40, 80, 0.7);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid #3a4a9a;
        }
        
        .panel h2 {
            color: #6ab1ff;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #3a4a9a;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .stat-item {
            background: rgba(40, 50, 100, 0.5);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #a0c8ff;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        
        .control-group {
            flex: 1;
            min-width: 200px;
        }
        
        .control-label {
            display: block;
            margin-bottom: 8px;
            color: #a0c8ff;
        }
        
        input[type="range"] {
            width: 100%;
            margin-bottom: 10px;
        }
        
        .range-value {
            text-align: center;
            font-weight: bold;
        }
        
        button {
            background: linear-gradient(to right, #4a90e2, #5fa5ff);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
            margin: 5px;
        }
        
        button:hover {
            background: linear-gradient(to right, #3a80d2, #4f95ef);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .btn-attack {
            background: linear-gradient(to right, #e74c3c, #ff6b6b);
        }
        
        .btn-attack:hover {
            background: linear-gradient(to right, #d73c2c, #ef5b5b);
        }
        
        .btn-defense {
            background: linear-gradient(to right, #27ae60, #2ecc71);
        }
        
        .btn-defense:hover {
            background: linear-gradient(to right, #1d9e50, #28b661);
        }
        
        .visualization {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-container {
            background: rgba(30, 40, 80, 0.7);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid #3a4a9a;
            height: 300px;
        }
        
        .log-container {
            background: rgba(30, 40, 80, 0.7);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid #3a4a9a;
            height: 300px;
            overflow-y: auto;
        }
        
        .log-entry {
            padding: 8px 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        
        .log-normal {
            background: rgba(40, 120, 180, 0.3);
            border-left: 4px solid #3498db;
        }
        
        .log-attack {
            background: rgba(200, 60, 60, 0.3);
            border-left: 4px solid #e74c3c;
        }
        
        .log-defense {
            background: rgba(40, 180, 80, 0.3);
            border-left: 4px solid #2ecc71;
        }
        
        .log-warning {
            background: rgba(230, 180, 40, 0.3);
            border-left: 4px solid #f39c12;
        }
        
        .chart {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
        }
        
        .bar {
            width: 60px;
            background: linear-gradient(to top, #4a90e2, #6ab1ff);
            border-radius: 4px 4px 0 0;
            position: relative;
            transition: height 0.5s;
        }
        
        .bar-attack {
            background: linear-gradient(to top, #e74c3c, #ff6b6b);
        }
        
        .bar-label {
            position: absolute;
            bottom: -25px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
        }
        
        .bar-value {
            position: absolute;
            top: -25px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .status-normal {
            background: #2ecc71;
            box-shadow: 0 0 8px #2ecc71;
        }
        
        .status-warning {
            background: #f39c12;
            box-shadow: 0 0 8px #f39c12;
        }
        
        .status-danger {
            background: #e74c3c;
            box-shadow: 0 0 8px #e74c3c;
        }
        
        .defense-mechanisms {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .defense-item {
            background: rgba(40, 50, 100, 0.5);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .defense-active {
            border: 2px solid #2ecc71;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }
        
        .defense-inactive {
            opacity: 0.6;
        }
        
        @media (max-width: 768px) {
            .dashboard, .visualization {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>高防服务器DDoS攻击模拟器</h1>
            <p class="subtitle">模拟高防服务器防御DDoS攻击的过程与机制</p>
        </header>
        
        <div class="dashboard">
            <div class="panel">
                <h2>服务器状态</h2>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-label">服务器负载</div>
                        <div class="stat-value" id="server-load">0%</div>
                        <div class="status-indicator">
                            <div class="status-dot status-normal" id="status-dot"></div>
                            <span id="status-text">正常运行</span>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">正常用户</div>
                        <div class="stat-value" id="legitimate-users">50</div>
                        <div class="stat-label">在线用户数量</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">攻击流量</div>
                        <div class="stat-value" id="attack-traffic">0</div>
                        <div class="stat-label">请求/秒</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">拦截攻击</div>
                        <div class="stat-value" id="blocked-attacks">0</div>
                        <div class="stat-label">已拦截请求</div>
                    </div>
                </div>
            </div>
            
            <div class="panel">
                <h2>攻击控制</h2>
                <div class="control-group">
                    <label class="control-label">攻击者数量: <span id="attackers-value">0</span></label>
                    <input type="range" id="attackers" min="0" max="100" value="0">
                    
                    <label class="control-label">攻击强度: <span id="attack-power-value">0</span> 请求/秒</label>
                    <input type="range" id="attack-power" min="0" max="1000" value="0">
                    
                    <div class="controls">
                        <button class="btn-attack" id="start-attack">发起攻击</button>
                        <button class="btn-defense" id="enable-defense">启用防御</button>
                        <button id="reset">重置模拟</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="visualization">
            <div class="chart-container">
                <h2>流量监控</h2>
                <div class="chart" id="traffic-chart">
                    <!-- 图表将通过JS动态生成 -->
                </div>
            </div>
            
            <div class="log-container">
                <h2>防御日志</h2>
                <div id="defense-log">
                    <div class="log-entry log-normal">服务器启动，防御系统初始化完成</div>
                    <div class="log-entry log-defense">流量清洗系统已就绪</div>
                    <div class="log-entry log-defense">IP信誉系统已激活</div>
                    <div class="log-entry log-normal">等待模拟开始...</div>
                </div>
            </div>
        </div>
        
        <div class="panel">
            <h2>防御机制</h2>
            <div class="defense-mechanisms">
                <div class="defense-item defense-active" id="defense-1">
                    <h3>流量清洗</h3>
                    <p>过滤恶意流量，转发合法请求</p>
                </div>
                <div class="defense-item defense-active" id="defense-2">
                    <h3>IP信誉系统</h3>
                    <p>识别并拦截可疑IP地址</p>
                </div>
                <div class="defense-item defense-active" id="defense-3">
                    <h3>速率限制</h3>
                    <p>限制单个IP的请求频率</p>
                </div>
                <div class="defense-item defense-active" id="defense-4">
                    <h3>协议分析</h3>
                    <p>深度检测异常协议行为</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟器状态
        const state = {
            serverCapacity: 1000,
            currentLoad: 0,
            legitimateUsers: 50,
            attackers: 0,
            attackPower: 0,
            defenseEnabled: true,
            blockedAttacks: 0,
            isUnderAttack: false,
            attackInterval: null,
            normalTraffic: 50,
            attackTraffic: 0,
            totalRequests: 0,
            blockedRequests: 0
        };

        // DOM元素
        const serverLoadEl = document.getElementById('server-load');
        const legitimateUsersEl = document.getElementById('legitimate-users');
        const attackTrafficEl = document.getElementById('attack-traffic');
        const blockedAttacksEl = document.getElementById('blocked-attacks');
        const attackersSlider = document.getElementById('attackers');
        const attackersValueEl = document.getElementById('attackers-value');
        const attackPowerSlider = document.getElementById('attack-power');
        const attackPowerValueEl = document.getElementById('attack-power-value');
        const startAttackBtn = document.getElementById('start-attack');
        const enableDefenseBtn = document.getElementById('enable-defense');
        const resetBtn = document.getElementById('reset');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const defenseLog = document.getElementById('defense-log');
        const trafficChart = document.getElementById('traffic-chart');

        // 初始化
        function init() {
            updateUI();
            setupEventListeners();
            generateTrafficChart();
        }

        // 设置事件监听器
        function setupEventListeners() {
            attackersSlider.addEventListener('input', function() {
                state.attackers = parseInt(this.value);
                attackersValueEl.textContent = state.attackers;
                updateUI();
            });

            attackPowerSlider.addEventListener('input', function() {
                state.attackPower = parseInt(this.value);
                attackPowerValueEl.textContent = state.attackPower;
                updateUI();
            });

            startAttackBtn.addEventListener('click', function() {
                if (state.isUnderAttack) {
                    stopAttack();
                    this.textContent = '发起攻击';
                    addLog('攻击已停止', 'defense');
                } else {
                    startAttack();
                    this.textContent = '停止攻击';
                    addLog(`检测到DDoS攻击！攻击强度: ${state.attackPower} 请求/秒`, 'attack');
                }
            });

            enableDefenseBtn.addEventListener('click', function() {
                state.defenseEnabled = !state.defenseEnabled;
                if (state.defenseEnabled) {
                    this.textContent = '禁用防御';
                    addLog('防御系统已启用', 'defense');
                } else {
                    this.textContent = '启用防御';
                    addLog('防御系统已禁用 - 服务器处于危险中！', 'warning');
                }
                updateDefenseMechanisms();
            });

            resetBtn.addEventListener('click', function() {
                resetSimulation();
                addLog('模拟已重置', 'normal');
            });
        }

        // 开始攻击
        function startAttack() {
            state.isUnderAttack = true;
            state.attackTraffic = state.attackPower;
            
            state.attackInterval = setInterval(function() {
                // 模拟正常流量波动
                state.normalTraffic = Math.max(10, state.legitimateUsers + Math.floor(Math.random() * 40) - 20);
                
                // 模拟攻击流量波动
                if (state.isUnderAttack) {
                    state.attackTraffic = Math.max(10, state.attackPower + Math.floor(Math.random() * 200) - 100);
                }
                
                // 计算总负载
                const totalTraffic = state.normalTraffic + state.attackTraffic;
                
                // 防御系统工作
                if (state.defenseEnabled) {
                    // 假设防御系统能拦截80%的攻击流量
                    const blocked = Math.floor(state.attackTraffic * 0.8);
                    state.blockedRequests += blocked;
                    state.blockedAttacks = state.blockedRequests;
                    
                    // 实际到达服务器的流量
                    const actualTraffic = state.normalTraffic + Math.floor(state.attackTraffic * 0.2);
                    state.currentLoad = Math.min(100, Math.floor((actualTraffic / state.serverCapacity) * 100));
                } else {
                    // 没有防御，所有流量直接到达服务器
                    state.currentLoad = Math.min(100, Math.floor((totalTraffic / state.serverCapacity) * 100));
                    state.blockedRequests += 0; // 没有拦截
                }
                
                // 记录总请求数
                state.totalRequests += totalTraffic;
                
                // 随机生成一些日志
                if (Math.random() > 0.7) {
                    if (state.defenseEnabled) {
                        const logTypes = [
                            `已拦截来自IP 192.168.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}的异常流量`,
                            '流量清洗系统正在过滤恶意请求',
                            'IP信誉系统已标记可疑IP段',
                            '速率限制阻止了高频请求'
                        ];
                        addLog(logTypes[Math.floor(Math.random() * logTypes.length)], 'defense');
                    } else {
                        addLog('警告：服务器正在接收大量恶意请求！', 'warning');
                    }
                }
                
                updateUI();
                updateTrafficChart();
            }, 1000);
        }

        // 停止攻击
        function stopAttack() {
            state.isUnderAttack = false;
            state.attackTraffic = 0;
            if (state.attackInterval) {
                clearInterval(state.attackInterval);
                state.attackInterval = null;
            }
            updateUI();
        }

        // 重置模拟
        function resetSimulation() {
            stopAttack();
            state.currentLoad = 0;
            state.legitimateUsers = 50;
            state.attackers = 0;
            state.attackPower = 0;
            state.defenseEnabled = true;
            state.blockedAttacks = 0;
            state.isUnderAttack = false;
            state.normalTraffic = 50;
            state.attackTraffic = 0;
            state.totalRequests = 0;
            state.blockedRequests = 0;
            
            attackersSlider.value = 0;
            attackPowerSlider.value = 0;
            attackersValueEl.textContent = '0';
            attackPowerValueEl.textContent = '0';
            startAttackBtn.textContent = '发起攻击';
            enableDefenseBtn.textContent = '禁用防御';
            
            defenseLog.innerHTML = `
                <div class="log-entry log-normal">服务器启动，防御系统初始化完成</div>
                <div class="log-entry log-defense">流量清洗系统已就绪</div>
                <div class="log-entry log-defense">IP信誉系统已激活</div>
                <div class="log-entry log-normal">模拟已重置</div>
            `;
            
            updateUI();
            updateDefenseMechanisms();
            generateTrafficChart();
        }

        // 更新UI
        function updateUI() {
            serverLoadEl.textContent = `${state.currentLoad}%`;
            legitimateUsersEl.textContent = state.legitimateUsers;
            attackTrafficEl.textContent = state.attackTraffic;
            blockedAttacksEl.textContent = state.blockedRequests.toLocaleString();
            
            // 更新状态指示器
            if (state.currentLoad < 60) {
                statusDot.className = 'status-dot status-normal';
                statusText.textContent = '正常运行';
            } else if (state.currentLoad < 85) {
                statusDot.className = 'status-dot status-warning';
                statusText.textContent = '负载较高';
            } else {
                statusDot.className = 'status-dot status-danger';
                statusText.textContent = '严重过载';
            }
        }

        // 更新防御机制显示
        function updateDefenseMechanisms() {
            for (let i = 1; i <= 4; i++) {
                const defenseItem = document.getElementById(`defense-${i}`);
                if (state.defenseEnabled) {
                    defenseItem.classList.add('defense-active');
                    defenseItem.classList.remove('defense-inactive');
                } else {
                    defenseItem.classList.remove('defense-active');
                    defenseItem.classList.add('defense-inactive');
                }
            }
        }

        // 添加日志
        function addLog(message, type) {
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            logEntry.textContent = `[${timestamp}] ${message}`;
            
            defenseLog.appendChild(logEntry);
            defenseLog.scrollTop = defenseLog.scrollHeight;
            
            // 限制日志数量
            if (defenseLog.children.length > 20) {
                defenseLog.removeChild(defenseLog.firstChild);
            }
        }

        // 生成流量图表
        function generateTrafficChart() {
            trafficChart.innerHTML = '';
            
            const bars = [
                { label: '正常流量', value: state.normalTraffic, type: 'normal' },
                { label: '攻击流量', value: state.attackTraffic, type: 'attack' },
                { label: '拦截流量', value: state.blockedRequests > 1000 ? Math.min(1000, state.blockedRequests / 100) : state.blockedRequests, type: 'defense' }
            ];
            
            bars.forEach(bar => {
                const barEl = document.createElement('div');
                barEl.className = `bar ${bar.type === 'attack' ? 'bar-attack' : ''}`;
                
                // 计算高度 (最大为250px)
                const height = Math.min(250, (bar.value / 1000) * 250);
                barEl.style.height = `${height}px`;
                
                const labelEl = document.createElement('div');
                labelEl.className = 'bar-label';
                labelEl.textContent = bar.label;
                
                const valueEl = document.createElement('div');
                valueEl.className = 'bar-value';
                valueEl.textContent = bar.value > 1000 ? `${(bar.value/1000).toFixed(1)}k` : bar.value;
                
                barEl.appendChild(valueEl);
                barEl.appendChild(labelEl);
                trafficChart.appendChild(barEl);
            });
        }

        // 更新流量图表
        function updateTrafficChart() {
            generateTrafficChart();
        }

        // 初始化模拟器
        init();
    </script>
</body>
  </html>
